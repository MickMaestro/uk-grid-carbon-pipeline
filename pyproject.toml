[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uk-grid-carbon-pipeline"
version = "0.1.0"
description = "Daily pipeline for GB electricity carbon intensity data from the NESO Carbon Intensity API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "tzdata",  # zoneinfo needs this on Windows, which has no time zone database of its own
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "responses>=0.25",
    "ruff>=0.6",
    "pre-commit>=3.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
