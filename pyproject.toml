[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uk-grid-carbon-pipeline"
version = "0.1.0"
description = "Daily pipeline for GB electricity carbon intensity data from the NESO Carbon Intensity API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "tzdata",  # zoneinfo needs this on Windows, which has no time zone database of its own
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "responses>=0.25",
    "ruff>=0.6",
    "pre-commit>=3.7",
]

[project.scripts]
carbon-ingest = "grid_carbon.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N", "S", "DTZ", "G", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
